# v0.1 示例总配置（recursive-tune）
# 复制此文件并按你的实验修改。必填段：target_path / writer / judge / automations。
# aggregate 段可选——出现即整体覆盖 scoring.yaml 的 aggregate。

target_path: "./demo-target"       # A 类 Target 仓库路径（必须 git init 过）
writer: writer                     # Writer Hermes profile 名（setup_profiles.sh 创建）
judge: judge                       # Judge Hermes profile 名

program:                           # 生成 program.md 用的任务指令
  objective: "第一轮：把 demo-target/config.py 的 TARGET_VALUE 从 0 改为 42，让 pytest 全绿。之后每轮：做一次聚焦的代码质量改进（注释、命名、结构、可读性），让 clarity 与 consistency 维度持续上升。"
  constraints:
    - "只允许修改 demo-target/config.py"
    - "禁止修改 test_config.py"
    - "每次迭代只做一次聚焦改动"

automations:                       # D8 rule 5：每轮迭代硬超时
  iter_timeout_minutes: 5          # 默认 5 分钟；改这里
